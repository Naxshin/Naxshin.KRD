# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # ════════════════════════════════════════════════════════════════
# NAXSHIN — GitHub Actions Deploy with Firebase Config Injection
# This workflow injects Firebase config from GitHub Secrets
# so the API keys never appear in your source code repository.
# ════════════════════════════════════════════════════════════════
name: Deploy Naxshin to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase Config from Secrets
        run: |
          # Replace placeholder values in index.html with real secrets
          sed -i "s|YOUR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" index.html
          sed -i "s|YOUR_AUTH_DOMAIN|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" index.html
          sed -i "s|YOUR_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" index.html
          sed -i "s|YOUR_MESSAGING_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" index.html
          sed -i "s|YOUR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" index.html
          sed -i "s|YOUR_DATABASE_URL|${{ secrets.FIREBASE_DATABASE_URL }}|g" index.html
          sed -i "s|YOUR_ADMIN_EMAIL|${{ secrets.ADMIN_EMAIL }}|g" index.html
          echo "✅ Config injected successfully"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
